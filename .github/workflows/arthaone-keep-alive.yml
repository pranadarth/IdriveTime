name: Keep Supabase Alive (Write & Clean)

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Delete old logs (Cleanup)
        run: |
          curl -s -X DELETE \
            "https://hkxzrwutrfkboqzgcktg.supabase.co/rest/v1/keep_alive_logs?id=not.is.null" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: 2. Insert new ping to Database (Keep Active)
        run: |
          curl -s -X POST \
            "https://hkxzrwutrfkboqzgcktg.supabase.co/rest/v1/keep_alive_logs" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"pinged_at": "now()"}'
